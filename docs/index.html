<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090f1c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ساعت جهانی">
<meta name="description" content="ساعت زنده شهرهای جهان با تاریخ شمسی">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg">
<title>ساعت جهانی</title>
<style>
:root{color-scheme:dark;--bg:#090f1c;--panel:#121c2c;--muted:#8491a6;--cyan:#54d7e9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#172b40 0,transparent 42%),linear-gradient(160deg,#080e19,#101827);color:#f6f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:auto;padding:24px 18px 38px}.head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 25px}.eyebrow{direction:ltr;text-align:right;letter-spacing:3px;color:var(--cyan);font-size:10px;font-weight:800}.title{font-size:30px;font-weight:800;margin:6px 0}.sub{font-size:13px;color:var(--muted)}.globe{font-size:35px;background:#ffffff0d;border:1px solid #ffffff12;border-radius:19px;padding:13px}
.panel,.card{background:linear-gradient(145deg,#ffffff12,#ffffff07);border:1px solid #ffffff12;border-radius:23px;padding:18px;margin:14px 0;box-shadow:0 12px 30px #0002}.local{background:linear-gradient(130deg,#16424a88,#ffffff08)}.labelrow{display:flex;align-items:center;gap:8px;color:#b9c5d5;font-size:12px}.live{color:#5ee6a8;font-weight:800;direction:ltr}.dot{width:7px;height:7px;background:#5ee6a8;border-radius:50%}.time{font-size:40px;direction:ltr;text-align:left;font-variant-numeric:tabular-nums;font-weight:300;margin:12px 0 4px;letter-spacing:1px}.date{font-size:12px;color:#9aa8bb}.section{display:flex;justify-content:space-between;align-items:center;margin:25px 3px 10px}.section strong{font-size:18px}.count{font-size:12px;color:var(--muted)}.citytop{display:flex;align-items:center;gap:12px}.flag{font-size:31px;background:#ffffff0c;padding:9px;border-radius:15px}.names{flex:1}.country{font-weight:750;font-size:17px}.city{font-size:12px;color:var(--muted);margin-top:3px}.remove{border:0;background:#ffffff0c;color:#9ba8b8;border-radius:50%;width:31px;height:31px;font-size:17px}.clockrow{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 12px}.citytime{font-size:35px;font-weight:300;direction:ltr;font-variant-numeric:tabular-nums}.offset{font-size:10px;color:var(--cyan);direction:ltr}.divider{height:1px;background:#ffffff12}.bottom{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;color:#9aa8bb;font-size:11px}.add{width:100%;border:1px dashed #54d7e966;background:#54d7e912;color:var(--cyan);padding:16px;border-radius:18px;font-size:15px;font-weight:700;margin:12px 0}.note{text-align:center;color:#6f7d91;font-size:11px;margin-top:20px}
dialog{border:1px solid #ffffff20;background:#111b2b;color:#fff;border-radius:22px;width:min(92vw,480px);max-height:82vh;padding:18px}dialog::backdrop{background:#000a}.dlghead{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:12px}.close{border:0;background:#ffffff12;color:white;border-radius:12px;padding:8px 12px}.search{width:100%;border:1px solid #ffffff20;border-radius:13px;padding:13px;background:#ffffff0a;color:white;font-size:15px;margin-bottom:10px}.cityoption{width:100%;display:flex;gap:12px;align-items:center;text-align:right;background:#ffffff08;color:white;border:0;border-radius:13px;padding:13px;margin:6px 0}.cityoption span:nth-child(2){flex:1}.empty{text-align:center;color:var(--muted);padding:22px}
</style></head>
<body><main>
<header class="head"><div><div class="eyebrow">WORLD CLOCK</div><div class="title">ساعت جهانی</div><div class="sub">زمان دنیا، همیشه همراه تو</div></div><div class="globe">🌐</div></header>
<section class="panel local"><div class="labelrow"><span class="dot"></span><span class="live">LIVE</span><span style="margin-right:auto">زمان فعلی دستگاه</span></div><div class="time" id="localTime">--:--:--</div><div class="date" id="localDate"></div></section>
<div class="section"><strong>ساعت شهرها</strong><span class="count" id="count"></span></div>
<div id="clocks"></div><button class="add" id="add">＋ افزودن شهر جدید</button>
<div class="note">زمان شهرها به‌صورت خودکار به‌روزرسانی می‌شود</div>
</main>
<dialog id="picker"><div class="dlghead"><span>افزودن شهر</span><button class="close" id="close">بستن</button></div><input class="search" id="search" placeholder="جستجوی شهر یا کشور"><div id="options"></div></dialog>
<script>
const all=[
{id:"iran",country:"ایران",city:"تهران",flag:"🇮🇷",zone:"Asia/Tehran"},{id:"thailand",country:"تایلند",city:"بانکوک",flag:"🇹🇭",zone:"Asia/Bangkok"},{id:"russia",country:"روسیه",city:"مسکو",flag:"🇷🇺",zone:"Europe/Moscow"},{id:"germany",country:"آلمان",city:"برلین",flag:"🇩🇪",zone:"Europe/Berlin"},{id:"uk",country:"بریتانیا",city:"لندن",flag:"🇬🇧",zone:"Europe/London"},{id:"uae",country:"امارات",city:"دبی",flag:"🇦🇪",zone:"Asia/Dubai"},{id:"turkey",country:"ترکیه",city:"استانبول",flag:"🇹🇷",zone:"Europe/Istanbul"},{id:"japan",country:"ژاپن",city:"توکیو",flag:"🇯🇵",zone:"Asia/Tokyo"},{id:"usa_ny",country:"آمریکا",city:"نیویورک",flag:"🇺🇸",zone:"America/New_York"},{id:"usa_la",country:"آمریکا",city:"لس‌آنجلس",flag:"🇺🇸",zone:"America/Los_Angeles"},{id:"canada",country:"کانادا",city:"تورنتو",flag:"🇨🇦",zone:"America/Toronto"},{id:"australia",country:"استرالیا",city:"سیدنی",flag:"🇦🇺",zone:"Australia/Sydney"}];
let selected=JSON.parse(localStorage.getItem("globalClockCities")||'["iran","thailand","russia"]');
const fmt=(d,z,opts)=>new Intl.DateTimeFormat("en-GB",{timeZone:z,...opts}).format(d);
const dateFmt=(d,z)=>new Intl.DateTimeFormat("fa-IR-u-ca-persian",{timeZone:z,weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d);
const offset=(d,z)=>{let p=fmt(d,z,{timeZoneName:"longOffset"}).split(" ").pop().replace("GMT","UTC");return p==="UTC"?"UTC+00:00":p.replace("UTC−","UTC-").replace("UTC+","UTC+")};
function draw(){const d=new Date();document.getElementById("localTime").textContent=fmt(d,Intl.DateTimeFormat().resolvedOptions().timeZone,{hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});document.getElementById("localDate").textContent=dateFmt(d,Intl.DateTimeFormat().resolvedOptions().timeZone);
const items=selected.map(id=>all.find(x=>x.id===id)).filter(Boolean);document.getElementById("count").textContent=items.length+" شهر";document.getElementById("clocks").innerHTML=items.map(x=>'<article class="card"><div class="citytop"><div class="names"><div class="country">'+x.country+'</div><div class="city">'+x.city+'</div></div><div class="flag">'+x.flag+'</div><button class="remove" aria-label="حذف شهر" data-remove="'+x.id+'">×</button></div><div class="clockrow"><span class="offset">'+offset(d,x.zone)+'</span><span class="citytime">'+fmt(d,x.zone,{hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"})+'</span></div><div class="divider"></div><div class="bottom"><span>'+dateFmt(d,x.zone)+'</span><span>● زمان محلی</span></div></article>').join("");
document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{selected=selected.filter(x=>x!==b.dataset.remove);save()});}
function save(){localStorage.setItem("globalClockCities",JSON.stringify(selected));draw();renderOptions()}
const dlg=document.getElementById("picker");function renderOptions(){const q=document.getElementById("search").value.trim().toLowerCase();const available=all.filter(x=>!selected.includes(x.id)&&(!q||(x.city+" "+x.country).toLowerCase().includes(q)));document.getElementById("options").innerHTML=available.length?available.map(x=>'<button class="cityoption" data-add="'+x.id+'"><span>'+x.flag+'</span><span><b>'+x.city+'</b><br><small style="color:#9aa8bb">'+x.country+'</small></span><b style="color:#54d7e9">＋</b></button>').join(""):'<div class="empty">شهری پیدا نشد</div>';document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{selected.push(b.dataset.add);save();dlg.close()})}
document.getElementById("add").onclick=()=>{document.getElementById("search").value="";renderOptions();dlg.showModal()};document.getElementById("close").onclick=()=>dlg.close();document.getElementById("search").oninput=renderOptions;draw();setInterval(draw,1000);
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
