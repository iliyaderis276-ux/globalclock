name: GlobalClock
options:
  bundleIdPrefix: com.iliyaderis
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
targets:
  GlobalClock:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iliyaderis.globalclock
        INFOPLIST_KEY_CFBundleDisplayName: "ساعت جهانی"
        SWIFT_EMIT_LOC_STRINGS: YES
